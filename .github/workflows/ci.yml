name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q --cov=regresscheck --cov-report=term
      - name: CLI smoke test (mock provider, no keys)
        run: |
          regresscheck --version
          regresscheck validate
          regresscheck check
          set +e; regresscheck check --prompt demo/prompts/v3-bad.yaml; code=$?; set -e
          test "$code" -eq 2 || { echo "expected the deliberately bad prompt to fail the gate (exit 2), got $code"; exit 1; }

  mutation:
    # testteeth mutates only the functions changed by this push / PR ([tool.testteeth] in pyproject.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: testteeth (changed functions)
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=HEAD~1; fi
          testteeth run --base "$BASE" --fail-under 85 --workers 2

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t regresscheck:ci .
      - name: container smoke test
        run: |
          docker run --rm regresscheck:ci validate
          docker run --rm regresscheck:ci check --report reports/latest.html
          set +e; docker run --rm regresscheck:ci check --prompt demo/prompts/v3-bad.yaml; code=$?; set -e
          test "$code" -eq 2
