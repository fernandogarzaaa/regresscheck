[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "regresscheck"
version = "0.1.0"
description = "CI for LLM prompt and model changes: golden-dataset evals, run-to-run diffing, drift detection, HTML reports, Slack alerts and a GitHub Action gate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando Garza" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff==0.16.10",
  "mypy==2.4.0",
  "types-PyYAML>=6",
  "testteeth==0.2.0",
]

[project.scripts]
regresscheck = "regresscheck.cli:main"

[project.urls]
Homepage = "https://github.com/fernandogarzaaa/regresscheck"

[tool.setuptools.packages.find]
include = ["regresscheck*"]

[tool.setuptools.package-data]
regresscheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"regresscheck/report.py" = ["E501"]  # HTML template
"tests/*" = ["E501"]
"scripts/*" = ["E501"]

[tool.mypy]
python_version = "3.10"
packages = ["regresscheck"]
strict = true
ignore_missing_imports = true

[tool.testteeth]
paths = [
  "regresscheck/providers.py",
  "regresscheck/classifier.py",
  "regresscheck/judge.py",
  "regresscheck/records.py",
  "regresscheck/diff.py",
  "regresscheck/drift.py",
  "regresscheck/config.py",
  "regresscheck/store.py",
  "regresscheck/alerts.py",
  "regresscheck/runner.py",
]
test_args = ["-x", "-q", "-p", "no:cacheprovider", "--ignore=tests/test_cli.py"]
